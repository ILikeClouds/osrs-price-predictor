name: Daily Price Pipeline

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Build item name matrix
        id: set-matrix
        run: |
          MATRIX=$(python3 -c "
          import json
          with open('tracked_items.json') as f:
              items = json.load(f)
          print(json.dumps(items))
          ")
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Matrix: $MATRIX"

  run-pipeline:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        item: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
      max-parallel: 8
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preprocess ${{ matrix.item }}
        run: python src/preprocess.py --item-name "${{ matrix.item }}"

      # Evaluate model performance and log metrics.
      # Writes output/metrics_{item_id}.csv (per-item) so commit-results can
      # merge all items' metrics without filename collisions.
      - name: Train & evaluate ${{ matrix.item }}
        run: python src/train_model.py

      - name: Forecast ${{ matrix.item }}
        run: python src/predict_trends.py

      # Prediction JSON — one fresh file per job, no stale repo files mixed in
      - name: Upload prediction artifact
        uses: actions/upload-artifact@v4
        with:
          name: prediction-${{ strategy.job-index }}
          path: output/*.json
          retention-days: 2

      # History CSV — relative features for global model training
      # output/{item_id}.csv is written by preprocess.py
      # metrics_{item_id}.csv is written by train_model.py
      - name: Upload history artifact
        uses: actions/upload-artifact@v4
        with:
          name: history-${{ strategy.job-index }}
          path: output/*.csv
          retention-days: 2

  commit-results:
    needs: run-pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download all prediction artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: prediction-*
          path: docs/predictions/
          merge-multiple: true

      # History CSVs land in data/history/{item_id}.csv alongside any
      # previously committed files — the global model accumulates over time
      - name: Download all history artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: history-*
          path: data/history/
          merge-multiple: true

      # Merge per-item metrics_{item_id}.csv files downloaded into data/history/
      # into the cumulative metrics_log.csv that lives alongside them.
      # New rows are appended so the full history is preserved across runs.
      - name: Merge daily metrics into metrics_log.csv
        run: |
          python3 - <<'EOF'
          import os, glob, csv

          history_dir = "data/history"
          log_path    = os.path.join(history_dir, "metrics_log.csv")

          HEADER = ['date', 'item', 'model_tier', 'mae', 'rmse', 'r2',
                    'steps', 'regime_days', 'regime_start']

          # Collect all per-item metrics files written today
          new_rows = []
          for fpath in sorted(glob.glob(os.path.join(history_dir, "metrics_*.csv"))):
              if os.path.basename(fpath) == "metrics_log.csv":
                  continue
              with open(fpath, newline='') as f:
                  reader = csv.DictReader(f)
                  for row in reader:
                      new_rows.append([row.get(h, '') for h in HEADER])
              os.remove(fpath)   # clean up per-item file after merging

          if not new_rows:
              print("No new metric rows found — nothing to merge.")
          else:
              write_header = not os.path.exists(log_path)
              with open(log_path, 'a', newline='') as f:
                  w = csv.writer(f)
                  if write_header:
                      w.writerow(HEADER)
                  w.writerows(new_rows)
              print(f"Merged {len(new_rows)} row(s) → {log_path}")
          EOF

      - name: Build global model
        run: python src/build_global_model.py

      - name: Generate index.json
        run: python src/commit_output.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/history/ models/
          git diff --staged --quiet && echo "No changes to commit" || (
            git commit -m "chore: daily predictions $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          )
