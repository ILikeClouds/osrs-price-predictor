name: Daily Price Pipeline

on:
  schedule:
    - cron: '0 1 * * *'   # 01:00 UTC — after OSRS Wiki data is settled
  workflow_dispatch:       # allow manual runs from the GitHub Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Job 1: Build the item matrix from tracked_items.json ──────────────────
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Build item name matrix
        id: set-matrix
        run: |
          MATRIX=$(python3 -c "
          import json
          with open('tracked_items.json') as f:
              items = json.load(f)
          print(json.dumps(items))
          ")
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Matrix: $MATRIX"

  # ── Job 2: Run pipeline for each item in parallel ─────────────────────────
  run-pipeline:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        item: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
      max-parallel: 8     # 8 items at a time keeps API load reasonable
      fail-fast: false    # one item failing doesn't cancel the others

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preprocess ${{ matrix.item }}
        run: python src/preprocess.py --item-name "${{ matrix.item }}"

      - name: Forecast ${{ matrix.item }}
        run: python src/predict_trends.py

      # Upload only the single fresh JSON this job produced.
      # Writing to output/ (not docs/) means no stale files from the repo
      # checkout get mixed in with this run's artifact.
      - name: Upload prediction artifact
        uses: actions/upload-artifact@v4
        with:
          name: prediction-${{ strategy.job-index }}
          path: output/*.json
          retention-days: 2

      - name: Upload history artifact
        uses: actions/upload-artifact@v4
        with:
          name: history-${{ strategy.job-index }}
          path: data/history/
          retention-days: 2

  # ── Job 3: Collect results, rebuild global model, commit ──────────────────
  commit-results:
    needs: run-pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Download all 16 fresh prediction JSONs into docs/predictions/
      # Each artifact contains exactly one file so nothing gets stomped.
      - name: Download all prediction artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: prediction-*
          path: docs/predictions/
          merge-multiple: true

      - name: Download all history artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: history-*
          path: data/history/
          merge-multiple: true

      - name: Build global model
        run: python src/build_global_model.py

      - name: Generate index.json
        run: python src/commit_output.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/history/ models/
          git diff --staged --quiet && echo "No changes to commit" || (
            git commit -m "chore: daily predictions $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          )
